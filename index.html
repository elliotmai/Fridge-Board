<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" id="touch-icon" />
    <script>
      // iOS copies this icon once, at Add to Home Screen, and has no dark slot for web
      // apps. So in dark mode, offer the dark icon: add Hive while dark, keep it dark.
      (function () {
        var mq = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
        var link = document.getElementById('touch-icon');
        if (!mq || !link) return;
        var set = function () { link.href = mq.matches ? '/icons/apple-touch-icon-dark.png' : '/icons/apple-touch-icon.png'; };
        set();
        if (mq.addEventListener) mq.addEventListener('change', set); else if (mq.addListener) mq.addListener(set);
      })();
    </script>
    <!-- Full mobile viewport, non-zoomable, respects notches/safe areas -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8ece6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap" />
    <!-- Installable / standalone on iOS + Android -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Hive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
