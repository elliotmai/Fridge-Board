[build]
  command = "npm run build"
  publish = "dist"

# Netlify's secret scan flags any env var value it finds in the code. These
# aren't secrets: HOME_TZ's usual value is the function's default, and Hive's
# Firebase web config is meant to be in the page (Firebase's security comes
# from its rules and authorized domains, not from hiding it). Tokens and
# HIVE_SIGNING_KEY are still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "HOME_LAT,HOME_LON,HOME_TZ,VITE_HIVE_FIREBASE_API_KEY,VITE_HIVE_FIREBASE_AUTH_DOMAIN,VITE_HIVE_FIREBASE_PROJECT_ID,VITE_HIVE_FIREBASE_APP_ID"
  # Hive's Firebase web API key (src/config/hive.js) is public by design, so
  # smart detection shouldn't fail the build over it.
  # Public keys: Supabase publishable key (src/config/supabase.js), Hive's Firebase key,
  # and the old apps' Firebase keys (netlify/lib/carryOver.mjs).
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "sb_publishable_fZo1FUg_j4O1EHH-W2Jr1A_4P8W3o2S,AIzaSyBi5xLBJVPpGQj2qoNc7tPHB-HE3AIDBAE,AIzaSyA8rr1TEUUZ9b_PqR475mszkoC0aMoHeTE,AIzaSyArUnjG1BLqTbHCQqWruqLZDwy-aoMxgR4,AIzaSyAIJihKqOI3BJjSU7AZmBElHcvDJjeAIaQ,AIzaSyA-PPCs494aPCHuPEE6HIs2GgeCdHjviWw,AIzaSyApq0Wj12n2Gn8tjD0HJ-MsR3ON8hbh7QQ,AIzaSyC1KnocB9ogDmH27IQbjDQe-exvGa8wzsQ,AIzaSyBGb7feMWpPLvrToU7F-QAZOmNrta4KtdU,AIzaSyBFjXetA5vgZBLqpUHJ4OiXtXzfJ5fnE2U"

# Single-page app: send every path to index.html.
# Apps that have moved to Hive's Supabase project, served at Hive's own
# address so they share its sign-in (docs/supabase-migration-plan.md). Each
# app's own site keeps working on its own. Must come before the catch-all.
[[redirects]]
  from = "/apps/stimultrack/*"
  to = "https://stimul.flyingdoublemranch.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/apps/stimultrack"
  to = "/apps/stimultrack/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
